# Clock + wrist RGB-D (wrist_camera:=gazebo_realsense | femto_bolt). The ideal depth
# render goes to depth/ideal_image; d435_depth_processing.py publishes
# /crx10ia/camera/depth/image_raw and /crx10ia/camera/points_reframed from it.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: "GZ_TO_ROS"
- ros_topic_name: "/crx10ia/camera/image_raw"
  gz_topic_name: "/crx10ia/wrist/color/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: "GZ_TO_ROS"
- ros_topic_name: "/crx10ia/camera/camera_info"
  gz_topic_name: "/crx10ia/wrist/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: "GZ_TO_ROS"
- ros_topic_name: "/crx10ia/camera/depth/ideal_image"
  gz_topic_name: "/crx10ia/wrist/depth/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: "GZ_TO_ROS"
- ros_topic_name: "/crx10ia/camera/depth/camera_info"
  gz_topic_name: "/crx10ia/wrist/depth/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: "GZ_TO_ROS"
